# GitLab CI for pcov-enhanced (alternative pcov build).
#
# Mirrors .github/workflows/ci.yml: build the extension on the official
# php:8.2/8.3/8.4 images, run the .phpt suite in BOTH line and branch mode,
# build+validate the PECL tarball, build one prebuilt modules/pcov.so per PHP
# version (8.2/8.3/8.4), and on tag pushes publish a GitLab Release that
# attaches the tarball, all three prebuilt .so files and combined checksums.
#
# NOTE: the official `php:*` images are pulled from Docker Hub / the GitLab
# container registry, so every job below requires network access at CI time.
# This cannot run in a fully offline environment.

stages:
  - build
  - test
  - package
  - release

# Toolchain deps needed by phpize/configure/make on the Debian-based php images.
.php_setup: &php_setup
  before_script:
    - apt-get update
    - apt-get install -y $PHPIZE_DEPS git
  variables:
    PHPIZE_DEPS: "autoconf gcc make libc-dev pkg-config re2c"

# ---------------------------------------------------------------------------
# build: compile the extension across the PHP version matrix and cache the
# built tree (modules/pcov.so) for the test/package stages.
# ---------------------------------------------------------------------------
build:
  stage: build
  image: php:$PHP_VERSION
  <<: *php_setup
  parallel:
    matrix:
      - PHP_VERSION: ["8.2", "8.3", "8.4"]
  script:
    - phpize
    - ./configure --enable-pcov --with-php-config="$(command -v php-config)"
    - make -j"$(nproc)"
    - php -d extension="$(pwd)/modules/pcov.so" -d pcov.enabled=1 -r 'exit(phpversion("pcov")?0:1);'
  artifacts:
    paths:
      - modules/pcov.so
      - .libs/
    expire_in: 1 day

# ---------------------------------------------------------------------------
# test: run the .phpt suite in line mode (default) and branch mode
# (pcov.mode=branch) against the artifact built in the build stage.
# TEST_PHP_ARGS mirrors .github/workflows/ci.yml.
# ---------------------------------------------------------------------------
test:line:
  stage: test
  image: php:$PHP_VERSION
  <<: *php_setup
  parallel:
    matrix:
      - PHP_VERSION: ["8.2", "8.3", "8.4"]
  needs:
    - job: build
      parallel:
        matrix:
          - PHP_VERSION: ["8.2", "8.3", "8.4"]
      artifacts: true
  variables:
    NO_INTERACTION: "1"
    REPORT_EXIT_STATUS: "1"
    TEST_PHP_ARGS: "-d extension=$(pwd)/modules/pcov.so -d pcov.enabled=1 -d opcache.jit=disable -d opcache.jit_buffer_size=0 -q --show-diff"
  script:
    - php run-tests.php tests/

test:branch:
  stage: test
  image: php:$PHP_VERSION
  <<: *php_setup
  parallel:
    matrix:
      - PHP_VERSION: ["8.2", "8.3", "8.4"]
  needs:
    - job: build
      parallel:
        matrix:
          - PHP_VERSION: ["8.2", "8.3", "8.4"]
      artifacts: true
  variables:
    NO_INTERACTION: "1"
    REPORT_EXIT_STATUS: "1"
    TEST_PHP_ARGS: "-d extension=$(pwd)/modules/pcov.so -d pcov.enabled=1 -d pcov.mode=branch -d opcache.jit=disable -d opcache.jit_buffer_size=0 -q --show-diff"
  script:
    - php run-tests.php tests/

# ---------------------------------------------------------------------------
# prebuilt: build one release-ready modules/pcov.so per PHP version, matching
# GitHub's `prebuilt-binaries` matrix (8.2/8.3/8.4) so the GitLab release links
# one prebuilt binary per version (genuine parity, not just the php8.4 build).
#
# `parallel: matrix` spawns three independent job instances that share this one
# definition, so their dotenv reports are MERGED into any dependent job. If all
# three emitted the same variable name the last would clobber the others, so
# each instance writes VERSION-SPECIFIC dotenv keys at runtime:
#   PREBUILT_JOB_ID_82 / _83 / _84  and  SO_NAME_82 / _83 / _84
# (the "82"/"83"/"84" suffix is PHP_VERSION with the dot stripped). The release
# job then references each per-version id/name explicitly.
# ---------------------------------------------------------------------------
prebuilt:
  stage: package
  image: php:$PHP_VERSION
  <<: *php_setup
  parallel:
    matrix:
      - PHP_VERSION: ["8.2", "8.3", "8.4"]
  needs:
    - job: test:line
    - job: test:branch
  script:
    - phpize
    - ./configure --enable-pcov --with-php-config="$(command -v php-config)"
    - make -j"$(nproc)"
    - php -d extension="$(pwd)/modules/pcov.so" -d pcov.enabled=1 -r 'exit(phpversion("pcov")?0:1);'
    # Name the prebuilt .so to encode extension version + PHP version + OS +
    # arch + thread-safety, identical to GitHub's naming scheme.
    - VERSION=$(php -r '$x=simplexml_load_file("package.xml"); echo (string)$x->version->release;')
    - PHP_MINOR=$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')
    - ARCH=$(uname -m)
    - TS=$(php -r 'echo PHP_ZTS?"zts":"nts";')
    - SO_NAME="pcov-pcov-enhanced-${VERSION}-php${PHP_MINOR}-linux-${ARCH}-${TS}.so"
    - cp modules/pcov.so "$SO_NAME"
    - sha256sum "$SO_NAME" > "${SO_NAME}.sha256"
    # Emit VERSION-SPECIFIC dotenv keys so the three matrix instances do not
    # collide when their reports are merged into the checksums/release jobs.
    - SUFFIX=$(echo "$PHP_VERSION" | tr -d '.')
    - |
      {
        echo "PREBUILT_JOB_ID_${SUFFIX}=$CI_JOB_ID"
        echo "SO_NAME_${SUFFIX}=$SO_NAME"
      } > prebuilt.env
    - cat prebuilt.env
  artifacts:
    paths:
      - pcov-pcov-enhanced-*.so
      - pcov-pcov-enhanced-*.so.sha256
    reports:
      dotenv: prebuilt.env
    expire_in: 30 days

# ---------------------------------------------------------------------------
# package: validate + build the PECL tarball on php:8.4 and verify it builds
# and loads as the drop-in `pcov` extension. Emits its own job id + tarball
# name via dotenv for the release stage.
# ---------------------------------------------------------------------------
package:
  stage: package
  image: php:8.4
  <<: *php_setup
  needs:
    - job: test:line
    - job: test:branch
  script:
    - pecl package-validate package.xml
    - pecl package package.xml
    - ls -l pcov_enhanced-*.tgz
    # Verify the packaged tarball builds and loads as pcov.
    - tarball=$(ls pcov_enhanced-*.tgz)
    - tmp=$(mktemp -d)
    - tar -xzf "$tarball" -C "$tmp"
    - src=$(dirname "$(find "$tmp" -name config.m4 | head -n1)")
    - (cd "$src" && phpize && ./configure --enable-pcov --with-php-config="$(command -v php-config)" && make -j"$(nproc)")
    - php -d extension="$src/modules/pcov.so" -d pcov.enabled=1 -r 'exit(phpversion("pcov")?0:1);'
    - php -d extension="$src/modules/pcov.so" -d pcov.enabled=1 -d pcov.mode=branch -r 'exit(function_exists("xdebug_get_code_coverage")?0:1);'
    # Carry the exact tarball name and THIS job's id forward to the release
    # stage via a dotenv report. The release job cannot reference ${CI_JOB_ID}
    # (that is the release job's own id); it must point raw-artifact links at
    # the id of the package job that actually produced the files.
    - TGZ_NAME="$(ls pcov_enhanced-*.tgz)"
    - |
      {
        echo "PACKAGE_JOB_ID=$CI_JOB_ID"
        echo "TGZ_NAME=$TGZ_NAME"
      } > package.env
    - cat package.env
  artifacts:
    paths:
      - pcov_enhanced-*.tgz
    reports:
      dotenv: package.env
    expire_in: 30 days

# ---------------------------------------------------------------------------
# checksums: aggregate the PECL tarball + all three prebuilt .so files into one
# combined SHA256SUMS.txt, mirroring GitHub's `checksums` job. `needs` all four
# producers with artifacts:true so their files (and dotenv reports) are here.
# Emits its own job id so the release can link the aggregated checksums file.
# ---------------------------------------------------------------------------
checksums:
  stage: package
  image: php:8.4
  needs:
    - job: package
      artifacts: true
    - job: prebuilt
      artifacts: true
  script:
    - ls -l pcov_enhanced-*.tgz pcov-pcov-enhanced-*.so
    - sha256sum pcov_enhanced-*.tgz pcov-pcov-enhanced-*.so > SHA256SUMS.txt
    - cat SHA256SUMS.txt
    - |
      {
        echo "CHECKSUMS_JOB_ID=$CI_JOB_ID"
      } > checksums.env
    - cat checksums.env
  artifacts:
    paths:
      - SHA256SUMS.txt
    reports:
      dotenv: checksums.env
    expire_in: 30 days

# ---------------------------------------------------------------------------
# release: on tag pushes only, create a GitLab Release attaching the PECL
# tarball, all three prebuilt .so files (one per PHP version) and the combined
# checksums produced by the package stage. Uses release-cli via `release`.
# ---------------------------------------------------------------------------
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    # `artifacts: true` imports each upstream dotenv report, so PACKAGE_JOB_ID /
    # TGZ_NAME (package), PREBUILT_JOB_ID_82.._84 + SO_NAME_82.._84 (prebuilt
    # matrix), and CHECKSUMS_JOB_ID (checksums) are all available here.
    - job: package
      artifacts: true
    - job: prebuilt
      artifacts: true
    - job: checksums
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Publishing GitLab Release for $CI_COMMIT_TAG"
    - echo "Tarball from package job ${PACKAGE_JOB_ID}: ${TGZ_NAME}"
    - echo "Prebuilt .so from jobs ${PREBUILT_JOB_ID_82}/${PREBUILT_JOB_ID_83}/${PREBUILT_JOB_ID_84}:"
    - echo "  ${SO_NAME_82}, ${SO_NAME_83}, ${SO_NAME_84}"
    - echo "Checksums from job ${CHECKSUMS_JOB_ID}: SHA256SUMS.txt"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "pcov-enhanced $CI_COMMIT_TAG"
    description: "Automated release of pcov-enhanced $CI_COMMIT_TAG. Links the PECL tarball, one prebuilt pcov.so per PHP version (8.2/8.3/8.4), and the combined SHA256SUMS.txt."
    assets:
      # Link the actual deliverables (tarball + one prebuilt .so per PHP version
      # + combined checksums) so this GitLab Release matches the GitHub one.
      # Each link targets the RAW artifacts of the specific job that produced
      # the file (carried over dotenv); using ${CI_JOB_ID} here would point at
      # the release job, which never produced these files, and 404.
      links:
        - name: "${TGZ_NAME}"
          url: "${CI_PROJECT_URL}/-/jobs/${PACKAGE_JOB_ID}/artifacts/raw/${TGZ_NAME}"
          link_type: "package"
        - name: "${SO_NAME_82}"
          url: "${CI_PROJECT_URL}/-/jobs/${PREBUILT_JOB_ID_82}/artifacts/raw/${SO_NAME_82}"
          link_type: "other"
        - name: "${SO_NAME_83}"
          url: "${CI_PROJECT_URL}/-/jobs/${PREBUILT_JOB_ID_83}/artifacts/raw/${SO_NAME_83}"
          link_type: "other"
        - name: "${SO_NAME_84}"
          url: "${CI_PROJECT_URL}/-/jobs/${PREBUILT_JOB_ID_84}/artifacts/raw/${SO_NAME_84}"
          link_type: "other"
        - name: "SHA256SUMS.txt"
          url: "${CI_PROJECT_URL}/-/jobs/${CHECKSUMS_JOB_ID}/artifacts/raw/SHA256SUMS.txt"
          link_type: "other"
